services:
  mysql:
    image: mysql:8
    container_name: lingtu-mysql-compose
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: lingtu
      MYSQL_USER: lingtu
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lingtu123}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-ulingtu", "-p${MYSQL_PASSWORD:-lingtu123}", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: lingtu-backend
    environment:
      DATABASE_URL: mysql+pymysql://lingtu:${MYSQL_PASSWORD:-lingtu123}@mysql:3306/lingtu?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      LLM_MODEL: ${LLM_MODEL:-glm-4.7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: lingtu-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
